<!DOCTYPE html>

	<title>Indie Cross</title>

	<meta name="mobile-web-app-capable" content="yes">
	
	
	<link rel="shortcut icon" type="image/png" href="./favicon.png">
	
	
	<script type="text/javascript" src="./IndieCross.js?build=20261012-1"></script>
	
	<script>
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById ("viewport");
			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
	</script>
	
	<style>
		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
		/* minimal loading screen: black cover with a thin progress bar, text only for errors */
		#loading { position: fixed; inset: 0; z-index: 10; background: #000; }
		#loading::before { content: ""; position: absolute; left: 50%; top: 50%; width: 240px; height: 3px; margin: -1px 0 0 -120px; background: rgba(255, 255, 255, .15); }
		#loading i { position: absolute; left: 50%; top: 50%; width: 0; height: 3px; margin: -1px 0 0 -120px; background: #fff; transition: width .2s; }
		#loading p { position: absolute; top: calc(50% + 16px); width: 100%; margin: 0; color: #888; font: 13px monospace; text-align: center; }
		#openfl-content { background: #000000; width: 100%; height: 100%; }
		@font-face {
			font-family: 'Bronx';
			src: url('assets/fonts/Bronx.eot?#iefix') format('embedded-opentype'),
			url('assets/fonts/Bronx.woff') format('woff'),
			url('assets/fonts/Bronx.otf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'charliebubblesimple';
			src: url('assets/fonts/charliebubblesimple.eot?#iefix') format('embedded-opentype'),

			url('assets/fonts/Comic Sans MS.ttf') format('truetype'),
			url('assets/fonts/Comic Sans MS.svg#Comic%20Sans%20MS') format('svg');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Comic Sans UT Regular';
			src: url('assets/fonts/Comic Sans [PIXEL].eot?#iefix') format('embedded-opentype'),

<body>
	
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>
	
	<div id="openfl-content"></div>
	<div id="loading"><i></i></div>
	
	<script type="text/javascript">
		var loading = document.getElementById ("loading"), shown = 0;
		window.addEventListener ("error", function (e) {
			if (!loading) return;
			var p = loading.querySelector ("p") || loading.appendChild (document.createElement ("p"));
			p.textContent = "Error: " + e.message;
		});
		// called by IndieCross.js with lime's preload progress; the total grows as each library reports its size
		window.onGameLoading = function (loaded, total, done) {
			if (!loading) return;
			if (done) { loading.remove (); loading = null; return; }
			if (total > 0) shown = Math.max (shown, Math.min (1, loaded / total));
			loading.firstChild.style.width = 240 * shown + "px";
		};
		lime.embed ("IndieCross", "openfl-content", 1280, 720, { parameters: {} });
	</script>
	
</body>
</html>
